      .track-label { font-family: sans-serif; font-size: 8px; fill: var(--text-dim, #888); opacity: 0.5; }
      .track-label-bold { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: var(--text-dim, #888); opacity: 0.35; }
      .sector-marker { fill: var(--primary, #e10600); opacity: 0.6; }
      .sector-num { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: var(--text, #e0e0e0); text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

